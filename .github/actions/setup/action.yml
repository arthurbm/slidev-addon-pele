name: Set up
description: Node, pnpm and the workspace's dependencies; optionally agent-browser and its Chrome.

inputs:
  agent-browser:
    description: Also install agent-browser and the Chrome it drives.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.agent-browser == 'true'
      # Same version the browser suite was written against.
      run: |
        npm install --global agent-browser@0.39.0
        agent-browser install --with-deps
      shell: bash
